<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D'Cache Order Station</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#111;color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:28px}
button{border:0;border-radius:10px;padding:14px 18px;font-size:17px;font-weight:700;cursor:pointer}
.orange{background:#e8742f;color:#fff}
.green{background:#198754;color:#fff}
.blue{background:#2f6fb3;color:#fff}
.gray{background:#777;color:#fff}
.red{background:#b42318;color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:16px;background:#fff;border-bottom:1px solid #ddd}
#soundStatus{padding:12px 16px;border-radius:10px;background:#eee;font-weight:700}
#soundStatus.armed{background:#e8f7ec;color:#176b34}
.alert{display:none;margin:16px;padding:20px;border:3px solid #d92d20;border-radius:12px;background:#fff0ee;color:#b42318}
.alert.show{display:block}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
.summary div{background:#fff;padding:18px;border-radius:12px;box-shadow:0 1px 5px #ccc}
.summary strong{display:block;font-size:30px;margin-top:8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:#fff}
.tabs button{white-space:nowrap;background:#eee;color:#222}
.tabs button.active{background:#111;color:#fff}
#orders{padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#fff;border-radius:12px;padding:18px;border-left:7px solid #e8742f;box-shadow:0 2px 6px #ccc}
.card h3{margin:0 0 8px;font-size:22px}
.card p{margin:7px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.total{font-size:20px;font-weight:700}
.empty{grid-column:1/-1;background:#fff;border-radius:12px;padding:34px;text-align:center}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;overflow:auto}
.modal.show{display:block}
.formbox{width:min(700px,94%);margin:30px auto;background:#fff;border-radius:14px;padding:22px}
label{display:block;margin-top:14px;font-weight:700}
input,textarea,select{width:100%;padding:13px;margin-top:5px;border:1px solid #bbb;border-radius:8px;font-size:17px}
textarea{min-height:90px}
.form-actions{position:sticky;bottom:0;background:#fff;padding-top:16px;display:flex;gap:10px}
@media(max-width:800px){
  .summary{grid-template-columns:repeat(2,1fr)}
  #orders{grid-template-columns:1fr}
  header{align-items:flex-start}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>D'Cache Restaurant Orders</h1>
    <div>Live Kitchen & Pickup Order Station</div>
  </div>
  <button class="orange" onclick="openForm()">+ New Order</button>
</header>

<div class="toolbar">
  <button class="blue" id="soundBtn" onclick="armSound()">🔊 Enable Sound</button>
  <button class="gray" onclick="createTestOrder()">Create Test Order</button>
  <div id="soundStatus">Sound: OFF</div>
</div>

<div id="newAlert" class="alert">
  <h2>🔔 NEW ORDER WAITING</h2>
  <div id="alertText"></div>
</div>

<div class="summary">
  <div>Active Orders<strong id="activeCount">0</strong></div>
  <div>Preparing<strong id="prepCount">0</strong></div>
  <div>Ready for Pickup<strong id="readyCount">0</strong></div>
  <div>Today's Sales<strong id="salesTotal">$0.00</strong></div>
</div>

<div class="tabs">
  <button class="active" onclick="setFilter('All',this)">All Orders</button>
  <button onclick="setFilter('New',this)">New Orders</button>
  <button onclick="setFilter('Accepted',this)">Accepted</button>
  <button onclick="setFilter('Preparing',this)">Preparing</button>
  <button onclick="setFilter('Ready',this)">Ready</button>
  <button onclick="setFilter('Completed',this)">Completed</button>
</div>

<div id="orders"></div>

<div id="modal" class="modal">
  <div class="formbox">
    <h2>Create Pickup Order</h2>
    <label>Customer Name</label><input id="customer">
    <label>Phone Number</label><input id="phone">
    <label>Pickup Time</label><input id="pickup" type="time">
    <label>Order Items & Quantities</label><textarea id="items"></textarea>
    <label>Special Instructions</label><textarea id="notes"></textarea>
    <label>Total</label><input id="total" type="number" step="0.01">
    <label>Payment Status</label>
    <select id="payment">
      <option>Pay at Pickup</option>
      <option>Unpaid</option>
      <option>Paid by Card</option>
      <option>Paid in Cash</option>
    </select>
    <div class="form-actions">
      <button class="orange" onclick="saveOrder()">Send to Kitchen</button>
      <button class="gray" onclick="closeForm()">Cancel</button>
    </div>
  </div>
</div>

<script>
let orders = JSON.parse(localStorage.getItem("dcacheOrders") || "[]");
let filter = "All";

let audioCtx = null;
let soundArmed = false;
let alarmTimer = null;

function saveData(){
  localStorage.setItem("dcacheOrders", JSON.stringify(orders));
}

async function armSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended"){
      await audioCtx.resume();
    }
    soundArmed = true;
    document.getElementById("soundStatus").textContent = "Sound: ARMED";
    document.getElementById("soundStatus").classList.add("armed");
    document.getElementById("soundBtn").textContent = "🔊 Sound Armed";
    playAlarmPattern();
    syncAlarmState();
  }catch(e){
    alert("Sound could not be enabled in this browser.");
  }
}

function tone(freq, start, duration){
  if(!soundArmed || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + start);
  gain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime + start);
  osc.stop(audioCtx.currentTime + start + duration + 0.05);
}

function playAlarmPattern(){
  if(!soundArmed || !audioCtx) return;
  if(audioCtx.state === "suspended") audioCtx.resume();
  tone(880,0,.30);
  tone(1100,.38,.30);
  tone(880,.76,.30);
}

function startAlarm(){
  if(!soundArmed) return;
  if(alarmTimer) return;
  playAlarmPattern();
  alarmTimer = setInterval(playAlarmPattern, 3500);
}

function stopAlarm(){
  if(alarmTimer){
    clearInterval(alarmTimer);
    alarmTimer = null;
  }
}

function syncAlarmState(){
  const hasNew = orders.some(o => o.status === "New");
  if(hasNew) startAlarm();
  else stopAlarm();
}

function openForm(){document.getElementById("modal").classList.add("show")}
function closeForm(){document.getElementById("modal").classList.remove("show")}

function clearForm(){
  ["customer","phone","pickup","items","notes","total"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("payment").value="Pay at Pickup";
}

function saveOrder(){
  const customer = document.getElementById("customer").value.trim();
  const items = document.getElementById("items").value.trim();
  if(!customer || !items){
    alert("Please enter the customer name and order items.");
    return;
  }
  orders.unshift({
    id:Date.now(),
    number:orders.length+1,
    customer,
    phone:document.getElementById("phone").value,
    pickup:document.getElementById("pickup").value,
    items,
    notes:document.getElementById("notes").value,
    total:parseFloat(document.getElementById("total").value)||0,
    payment:document.getElementById("payment").value,
    status:"New",
    created:new Date().toISOString()
  });
  saveData();
  clearForm();
  closeForm();
  render();
}

function createTestOrder(){
  orders.unshift({
    id:Date.now(),
    number:orders.length+1,
    customer:"Test Customer",
    phone:"555-555-5555",
    pickup:"12:30",
    items:"1 Cubano Especial, 1 Maduros",
    notes:"Test order",
    total:18.50,
    payment:"Pay at Pickup",
    status:"New",
    created:new Date().toISOString()
  });
  saveData();
  render();
}

function changeStatus(id,status){
  const order = orders.find(o=>o.id===id);
  if(order){
    order.status = status;
    saveData();
    render();
  }
}

function deleteOrder(id){
  if(confirm("Delete this order?")){
    orders = orders.filter(o=>o.id!==id);
    saveData();
    render();
  }
}

function setFilter(value,button){
  filter = value;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  render();
}

function render(){
  const container = document.getElementById("orders");
  container.innerHTML = "";

  const shown = filter==="All" ? orders : orders.filter(o=>o.status===filter);

  if(!shown.length){
    container.innerHTML = '<div class="empty">No orders in this section.</div>';
  }

  shown.forEach(o=>{
    const card = document.createElement("div");
    card.className = "card";

    let buttons = "";
    if(o.status==="New")
      buttons += `<button class="orange" onclick="changeStatus(${o.id},'Accepted')">Accept</button>`;
    if(o.status==="Accepted")
      buttons += `<button class="blue" onclick="changeStatus(${o.id},'Preparing')">Start Preparing</button>`;
    if(o.status==="Preparing")
      buttons += `<button class="green" onclick="changeStatus(${o.id},'Ready')">Ready for Pickup</button>`;
    if(o.status==="Ready")
      buttons += `<button class="green" onclick="changeStatus(${o.id},'Completed')">Complete Order</button>`;
    buttons += `<button class="red" onclick="deleteOrder(${o.id})">Delete</button>`;

    card.innerHTML = `
      <h3>Order #${o.number} — ${o.customer}</h3>
      <p><strong>Status:</strong> ${o.status}</p>
      <p><strong>Phone:</strong> ${o.phone || "-"}</p>
      <p><strong>Pickup:</strong> ${o.pickup || "-"}</p>
      <p><strong>Items:</strong><br>${o.items}</p>
      <p><strong>Special Instructions:</strong><br>${o.notes || "None"}</p>
      <p><strong>Payment:</strong> ${o.payment}</p>
      <p class="total">Total: $${o.total.toFixed(2)}</p>
      <div class="actions">${buttons}</div>
    `;
    container.appendChild(card);
  });

  const newOrders = orders.filter(o=>o.status==="New");
  const alertBox = document.getElementById("newAlert");

  if(newOrders.length){
    alertBox.classList.add("show");
    document.getElementById("alertText").textContent =
      newOrders.length + " order(s) need to be accepted.";
  }else{
    alertBox.classList.remove("show");
  }

  document.getElementById("activeCount").textContent =
    orders.filter(o=>o.status!=="Completed").length;
  document.getElementById("prepCount").textContent =
    orders.filter(o=>o.status==="Preparing").length;
  document.getElementById("readyCount").textContent =
    orders.filter(o=>o.status==="Ready").length;

  const sales = orders.reduce((sum,o)=>sum+o.total,0);
  document.getElementById("salesTotal").textContent = "$" + sales.toFixed(2);

  syncAlarmState();
}

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && soundArmed){
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
    syncAlarmState();
  }
});

render();
</script>
</body>
</html>
